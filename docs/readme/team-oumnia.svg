<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 300" width="100%" role="img" aria-labelledby="t"><title id="t">Oumnia Elhirch, backend. Station 2 of 6 on the path of a fire detection: Signal.</title><style>:root{--ground:#FFFFFF;--ink:#0B0D12;--ink2:#394150;--muted:#5B6472;--blue:#0B3D91;--fire:#B8400E;--live:#9E0038;--line:#E3E6EB;--line2:#C9CED6}@media (prefers-color-scheme: dark){:root{--ground:#0B0D12;--ink:#F2F4F8;--ink2:#C3CAD6;--muted:#8E98AA;--blue:#7FB0FF;--fire:#F0803C;--live:#FF5C8A;--line:#232936;--line2:#586274}}.sans{font-family:ui-sans-serif, system-ui, "Segoe UI", sans-serif}.mono{font-family:ui-monospace, "SF Mono", Consolas, monospace}.ink{fill:var(--ink)}.mut{fill:var(--muted)}.blf{fill:var(--blue)}.bls{stroke:var(--blue)}.gnd{fill:var(--ground)}.box{fill:var(--ground);stroke:var(--line);stroke-width:1}.chain{fill:none;stroke:var(--line2);stroke-width:1.5;stroke-dasharray:1 5;stroke-linecap:round}.stn{font-size:11px;letter-spacing:2px;fill:var(--muted)}.stnl{fill:var(--fire)}.node{fill:var(--ground);stroke:var(--blue);stroke-opacity:.42;stroke-width:1.5}.ico{fill:none;stroke:var(--blue);stroke-opacity:.62;stroke-linecap:round;stroke-linejoin:round}.nodel{fill:var(--ground);stroke:var(--fire);stroke-width:1.5}.halo{fill:var(--fire);fill-opacity:.06;stroke:var(--fire);stroke-opacity:.45;stroke-width:1}.icol{fill:none;stroke:var(--fire);stroke-linecap:round;stroke-linejoin:round}.led{fill:currentColor}.ico .led{fill:var(--blue)}.icol .led{fill:var(--fire)}.first{font-size:22px;font-weight:700;fill:var(--ink)}.fam{font-size:16px;font-weight:400;fill:var(--muted)}.tick{stroke:var(--line2);stroke-width:1}.role{font-size:12px;letter-spacing:1.6px;fill:var(--ink2)}.ember{fill:var(--fire);opacity:0}.lit{opacity:0}.lit,.ein,.eout{animation-duration:9s;animation-iteration-count:infinite;animation-timing-function:linear;animation-delay:-7.5s}.lit{animation-name:lit}@keyframes lit{0%{opacity:0}3.33%{opacity:1}11.11%{opacity:1}17.78%{opacity:0}100%{opacity:0}}.ein{animation-name:ein}.eout{animation-name:eout}@keyframes eout{0%,11.1%{opacity:0;transform:translateX(0)}11.2%{opacity:1;transform:translateX(0)}13.8%{opacity:1;transform:translateX(88px)}13.9%,100%{opacity:0;transform:translateX(88px)}}@keyframes ein{0%,97.1%{opacity:0;transform:translateX(0)}97.2%{opacity:1;transform:translateX(0)}99.8%{opacity:1;transform:translateX(88px)}100%{opacity:0;transform:translateX(88px)}}.beat{animation:beat 1.5s ease-in-out infinite}@keyframes beat{0%,100%{opacity:1}50%{opacity:.15}}.led{animation:beat 3s steps(1,end) infinite}.l2{animation-delay:-1.5s}@media (prefers-reduced-motion: reduce){*{animation:none!important}.lit{opacity:0}.ember{opacity:0}}</style><rect x="1" y="1" width="278" height="298" rx="12" class="box"/><path d="M0 118H94M186 118H280" class="chain"/><text x="140" y="52" class="mono stn" text-anchor="middle">02 · SIGNAL</text><circle cx="140" cy="118" r="40" class="node"/><g transform="translate(119 97) scale(1.75)" class="ico" style="stroke-width:0.86"><rect x="4" y="3.5" width="16" height="7" rx="1.5"/><rect x="4" y="13.5" width="16" height="7" rx="1.5"/><path d="M10 7h7"/><circle cx="7" cy="7" r=".5" class="led"/><circle cx="7" cy="17" r=".5" class="led l2"/><path d="M9.5 17h2l1-2.3 1.6 4.6 1.1-2.3h2.3" class="beat"/></g><g class="lit"><circle cx="140" cy="118" r="50" class="halo"/><circle cx="140" cy="118" r="40" class="nodel"/><g transform="translate(119 97) scale(1.75)" class="icol" style="stroke-width:0.86"><rect x="4" y="3.5" width="16" height="7" rx="1.5"/><rect x="4" y="13.5" width="16" height="7" rx="1.5"/><path d="M10 7h7"/><circle cx="7" cy="7" r=".5" class="led"/><circle cx="7" cy="17" r=".5" class="led l2"/><path d="M9.5 17h2l1-2.3 1.6 4.6 1.1-2.3h2.3" class="beat"/></g><text x="140" y="52" class="mono stn stnl" text-anchor="middle">02 · SIGNAL</text></g><circle cx="0" cy="118" r="3" class="ember ein"/><circle cx="186" cy="118" r="3" class="ember eout"/><text x="140" y="204" class="sans first