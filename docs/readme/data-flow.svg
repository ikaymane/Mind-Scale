<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" role="img" aria-labelledby="title desc">
<title id="title">Four NASA sources, one NIRAN view of fire activity</title>
<desc id="desc">FIRMS supplies archive and near-real-time detections; POWER supplies monthly weather; GIBS supplies globe imagery and land cover; EONET supplies open wildfire events. Dots enter Cleaning one at a time, then reach the globe, country bulletins and year comparisons.</desc>
<style>:root{--ground:#FFFFFF;--ink:#0B0D12;--ink2:#394150;--muted:#5B6472;--blue:#0B3D91;--fire:#B8400E;--live:#9E0038;--line:#E3E6EB;--line2:#C9CED6}@media (prefers-color-scheme: dark){:root{--ground:#0B0D12;--ink:#F2F4F8;--ink2:#C3CAD6;--muted:#8E98AA;--blue:#7FB0FF;--fire:#F0803C;--live:#FF5C8A;--line:#232936;--line2:#586274}}.sans{font-family:ui-sans-serif, system-ui, "Segoe UI", sans-serif}.mono{font-family:ui-monospace, "SF Mono", Consolas, monospace}.ink{fill:var(--ink)}.mut{fill:var(--muted)}.blf{fill:var(--blue)}.bls{stroke:var(--blue)}.gnd{fill:var(--ground)}.hair{fill:none;stroke:var(--line);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.node{fill:var(--ground);stroke:var(--blue);stroke-opacity:.45;stroke-width:1.5}.eyebrow{font-size:12px;letter-spacing:1.6px;fill:var(--muted)}.detail{font-size:14px;letter-spacing:.5px;fill:var(--muted)}.still{display:none}.packet{fill:var(--fire);opacity:0;offset-rotate:0deg;animation:travel 12s linear infinite}@keyframes travel{0%{offset-distance:0%;opacity:0}2%{opacity:1}21%{offset-distance:100%;opacity:1}24%,100%{offset-distance:100%;opacity:0}}@media(prefers-reduced-motion:reduce){.packet{animation:none;display:none}.still{display:inline}}</style>
<rect width="1200" height="320" class="gnd"/>
<text x="60" y="27" class="mono eyebrow" >OPEN NASA DATA</text><path d="M380 62H450Q470 62 470 74V148Q470 160 482 160H834" class="hair"/><circle cx="76" cy="62" r="5" class="blf"/><text x="94" y="67" class="mono ink" font-size="20" letter-spacing="1">FIRMS</text><text x="94" y="89" class="mono detail" >ARCHIVE + NEAR-REAL-TIME</text><circle r="4" class="packet" style="offset-path:path('M380 62H450Q470 62 470 74V148Q470 160 482 160H834');animation-delay:-0s"/><path d="M380 126H450Q470 126 470 138V148Q470 160 482 160H834" class="hair"/><circle cx="76" cy="126" r="5" class="blf"/><text x="94" y="131" class="mono ink" font-size="20" letter-spacing="1">POWER</text><text x="94" y="153" class="mono detail" >MONTHLY WEATHER</text><circle r="4" class="packet" style="offset-path:path('M380 126H450Q470 126 470 138V148Q470 160 482 160H834');animation-delay:-9s"/><path d="M380 190H450Q470 190 470 178V172Q470 160 482 160H834" class="hair"/><circle cx="76" cy="190" r="5" class="blf"/><text x="94" y="195" class="mono ink" font-size="20" letter-spacing="1">GIBS</text><text x="94" y="217" class="mono detail" >GLOBE IMAGERY + LAND COVER</text><circle r="4" class="packet" style="offset-path:path('M380 190H450Q470 190 470 178V172Q470 160 482 160H834');animation-delay:-6s"/><path d="M380 254H450Q470 254 470 242V172Q470 160 482 160H834" class="hair"/><circle cx="76" cy="254" r="5" class="blf"/><text x="94" y="259" class="mono ink" font-size="20" letter-spacing="1">EONET</text><text x="94" y="281" class="mono detail" >OPEN WILDFIRE EVENTS</text><circle r="4" class="packet" style="offset-path:path('M380 254H450Q470 254 470 242V172Q470 160 482 160H834');animation-delay:-3s"/><rect x="552" y="120" width="136" height="80" rx="4" class="node"/><text x="620" y="168" class="sans ink" text-anchor="middle" font-size="23" font-weight="600">Cleaning</text><circle cx="715" cy="160" r="4" class="still" fill="var(--fire)"/><path d="m827 154 7 6-7 6" class="hair"/><rect x="852" y="82" width="288" height="164" rx="4" class="node"/><text x="876" y="112" class="mono eyebrow" >NIRAN VIEWS</text><text x="876" y="149" class="sans ink" font-size="21">3D globe</text><text x="876" y="184" class="sans ink" font-size="21">Country bulletins</text><text x="876" y="219" class="sans ink" font-size="21">Year comparisons</text>
</svg>
