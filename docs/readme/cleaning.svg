<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" role="img" aria-labelledby="title desc">
<title id="title">How the FIRMS archive is cleaned</title>
<desc id="desc">Illustrative rows, not data counts. Keep type 0 vegetation-fire detections. Keep MODIS confidence of at least 30 and VIIRS nominal or high confidence. Drop sites detected more than 60 days a year in at least two years. Rejected rows stop at their filter; retained rows reach the right.</desc>
<style>:root{--ground:#FFFFFF;--ink:#0B0D12;--ink2:#394150;--muted:#5B6472;--blue:#0B3D91;--fire:#B8400E;--live:#9E0038;--line:#E3E6EB;--line2:#C9CED6}@media (prefers-color-scheme: dark){:root{--ground:#0B0D12;--ink:#F2F4F8;--ink2:#C3CAD6;--muted:#8E98AA;--blue:#7FB0FF;--fire:#F0803C;--live:#FF5C8A;--line:#232936;--line2:#586274}}.sans{font-family:ui-sans-serif, system-ui, "Segoe UI", sans-serif}.mono{font-family:ui-monospace, "SF Mono", Consolas, monospace}.ink{fill:var(--ink)}.mut{fill:var(--muted)}.blf{fill:var(--blue)}.bls{stroke:var(--blue)}.gnd{fill:var(--ground)}.hair{fill:none;stroke:var(--line);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.node{fill:var(--ground);stroke:var(--blue);stroke-opacity:.45;stroke-width:1.5}.eyebrow{font-size:12px;letter-spacing:1.6px;fill:var(--muted)}.detail{font-size:14px;letter-spacing:.5px;fill:var(--muted)}.still{display:none}.raw{fill:var(--blue);opacity:.18}.row{fill:var(--blue);animation:row 10s linear infinite;opacity:0}.rejected{fill:var(--fire)}.type{animation-name:reject-type}.confidence{animation-name:reject-confidence}.persistent{animation-name:reject-persistent}.output{fill:var(--blue);opacity:.18}@keyframes row{0%,5%{transform:translateX(0);opacity:0}9%{opacity:1}88%,94%{transform:translateX(970px);opacity:1}100%{transform:translateX(970px);opacity:0}}@keyframes reject-type{0%,5%{transform:translateX(0);opacity:0}9%{opacity:1}25%{transform:translateX(250px);opacity:1}30%,100%{transform:translateX(250px);opacity:0}}@keyframes reject-confidence{0%,5%{transform:translateX(0);opacity:0}9%{opacity:1}49%{transform:translateX(510px);opacity:1}54%,100%{transform:translateX(510px);opacity:0}}@keyframes reject-persistent{0%,5%{transform:translateX(0);opacity:0}9%{opacity:1}73%{transform:translateX(770px);opacity:1}78%,100%{transform:translateX(770px);opacity:0}}.cross{fill:none;stroke:var(--fire);stroke-width:1.5;stroke-linecap:round}.gate{stroke:var(--blue);stroke-width:1.5;stroke-opacity:.45}.gate-label{font-size:15px;letter-spacing:1px;fill:var(--ink)}.note{font-size:13px;fill:var(--muted)}@media(prefers-reduced-motion:reduce){.row{animation:none;display:none}.still{display:inline}.output{opacity:.8}}</style>
<rect width="1200" height="280" class="gnd"/>
<text x="60" y="26" class="mono eyebrow" >ARCHIVE CLEANING</text><text x="60" y="63" class="mono detail" >RAW ROWS</text><text x="1138" y="63" class="mono detail" text-anchor="end">CLEAN ROWS</text><path d="M350 88V228" class="gate"/><text x="350" y="63" class="mono gate-label" text-anchor="middle">TYPE 0</text><path d="M610 88V228" class="gate"/><text x="610" y="63" class="mono gate-label" text-anchor="middle">CONFIDENCE</text><path d="M870 88V228" class="gate"/><text x="870" y="63" class="mono gate-label" text-anchor="middle">PERSISTENT SITES</text><text x="350" y="253" class="sans note" text-anchor="middle">Vegetation fires only</text><text x="610" y="249" class="mono note" text-anchor="middle">MODIS ≥ 30</text><text x="610" y="269" class="mono note" text-anchor="middle">VIIRS nominal / high</text><text x="870" y="249" class="mono note" text-anchor="middle">Drop &gt; 60 days / year</text><text x="870" y="269" class="mono note" text-anchor="middle">in at least 2 years</text><path d="M100 100H1100" class="hair" opacity=".24"/><g class="raw"><rect x="76" y="97" width="10" height="6" rx="1"/><rect x="92" y="97" width="25" height="6" rx="1"/></g><g class="row "><rect x="76" y="97" width="10" height="6" rx="1"/><rect x="92" y="97" width="25" height="6" rx="1"/></g><g class="output"><rect x="1046" y="97" width="10" height="6" rx="1"/><rect x="1062" y="97" width="25" height="6" rx="1"/></g><path d="M100 130H1100" class="hair" opacity=".24"/><g class="raw"><rect x="76" y="127" width="10" height="6" rx="1"/><rect x="92" y="127" width="25" height="6" rx="1"/></g><g class="row type rejected"><rect x="76" y="127" width="10" height="6" rx="1"/><rect x="92" y="127" width="25" height="6" rx="1"/></g><path d="m62 127 6 6m0-6-6 6" class="cross" opacity=".5"/><path d="m346 126 8 8m0-8-8 8" class="cross still"/><path d="M100 160H1100" class="hair" opacity=".24"/><g class="raw"><rect x="76" y="157" width="10" height="6" rx="1"/><rect x="92" y="157" width="25" height="6" rx="1"/></g><g class="row "><rect x="76" y="157" width="10" height="6" rx="1"/><rect x="92" y="157" width="25" height="6" rx="1"/></g><g class="output"><rect x="1046" y="157" width="10" height="6" rx="1"/><rect x="1062" y="157" width="25" height="6" rx="1"/></g><path d="M100 190H1100" class="hair" opacity=".24"/><g class="raw"><rect x="76" y="187" width="10" height="6" rx="1"/><rect x="92" y="187" width="25" height="6" rx="1"/></g><g class="row confidence rejected"><rect x="76" y="187" width="10" height="6" rx="1"/><rect x="92" y="187" width="25" height="6" rx="1"/></g><path d="m62 187 6 6m0-6-6 6" class="cross" opacity=".5"/><path d="m606 186 8 8m0-8-8 8" class="cross still"/><path d="M100 220H1100" class="hair" opacity=".24"/><g class="raw"><rect x="76" y="217" width="10" height="6" rx="1"/><rect x="92" y="217" width="25" height="6" rx="1"/></g><g class="row persistent rejected"><rect x="76" y="217" width="10" height="6" rx="1"/><rect x="92" y="217" width="25" height="6" rx="1"/></g><path d="m62 217 6 6m0-6-6 6" class="cross" opacity=".5"/><path d="m866 216 8 8m0-8-8 8" class="cross still"/>
</svg>
