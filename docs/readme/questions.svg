<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" role="img" aria-labelledby="title desc">
<title id="title">Three questions NIRAN answers</title>
<desc id="desc">Is this normal? Country bulletin and levels. When does my country burn? Country bulletins, seasonal context and 3D globe. What do I do now? Current fires, agent chat and safety tips. NIRAN describes observations; it does not predict fires.</desc>
<style>:root{--ground:#FFFFFF;--ink:#0B0D12;--ink2:#394150;--muted:#5B6472;--blue:#0B3D91;--fire:#B8400E;--live:#9E0038;--line:#E3E6EB;--line2:#C9CED6}@media (prefers-color-scheme: dark){:root{--ground:#0B0D12;--ink:#F2F4F8;--ink2:#C3CAD6;--muted:#8E98AA;--blue:#7FB0FF;--fire:#F0803C;--live:#FF5C8A;--line:#232936;--line2:#586274}}.sans{font-family:ui-sans-serif, system-ui, "Segoe UI", sans-serif}.mono{font-family:ui-monospace, "SF Mono", Consolas, monospace}.ink{fill:var(--ink)}.mut{fill:var(--muted)}.blf{fill:var(--blue)}.bls{stroke:var(--blue)}.gnd{fill:var(--ground)}.hair{fill:none;stroke:var(--line);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.node{fill:var(--ground);stroke:var(--blue);stroke-opacity:.45;stroke-width:1.5}.eyebrow{font-size:12px;letter-spacing:1.6px;fill:var(--muted)}.detail{font-size:14px;letter-spacing:.5px;fill:var(--muted)}.still{display:none}.question{opacity:0;animation:question 9s linear infinite}.question-title{font-size:44px;font-weight:600;letter-spacing:-.9px}.answer{font-size:15px;letter-spacing:1px;fill:var(--muted)}.progress{fill:var(--line2)}.active-progress{fill:var(--fire)}@keyframes question{0%{opacity:0}3%,29%{opacity:1}32%,100%{opacity:0}}@media(prefers-reduced-motion:reduce){.question{animation:none;display:none}.progress{display:none}.still{display:inline}}</style>
<rect width="1200" height="240" class="gnd"/>
<text x="60" y="32" class="mono eyebrow" >NIRAN ANSWERS</text><rect x="60" y="201" width="26" height="2" rx="1" class="progress"/><rect x="96" y="201" width="26" height="2" rx="1" class="progress"/><rect x="132" y="201" width="26" height="2" rx="1" class="progress"/><g class="question" style="animation-delay:-0s"><text x="60" y="112" class="sans ink question-title" >Is this normal?</text><text x="60" y="157" class="mono answer" >COUNTRY BULLETIN · LEVELS</text><rect x="60" y="201" width="26" height="2" rx="1" class="active-progress"/></g><g class="still"><text x="60" y="66" class="sans ink" font-size="26" font-weight="600">Is this normal?</text><text x="60" y="89" class="mono detail" >COUNTRY BULLETIN · LEVELS</text></g><g class="question" style="animation-delay:-6s"><text x="60" y="112" class="sans ink question-title" >When does my country burn?</text><text x="60" y="157" class="mono answer" >COUNTRY BULLETINS · SEASONAL CONTEXT · 3D GLOBE</text><rect x="96" y="201" width="26" height="2" rx="1" class="active-progress"/></g><g class="still"><text x="60" y="128" class="sans ink" font-size="26" font-weight="600">When does my country burn?</text><text x="60" y="151" class="mono detail" >COUNTRY BULLETINS · SEASONAL CONTEXT · 3D GLOBE</text></g><g class="question" style="animation-delay:-3s"><text x="60" y="112" class="sans ink question-title" >What do I do now?</text><text x="60" y="157" class="mono answer" >CURRENT FIRES · AGENT CHAT · SAFETY TIPS</text><rect x="132" y="201" width="26" height="2" rx="1" class="active-progress"/></g><g class="still"><text x="60" y="190" class="sans ink" font-size="26" font-weight="600">What do I do now?</text><text x="60" y="213" class="mono detail" >CURRENT FIRES · AGENT CHAT · SAFETY TIPS</text></g>
</svg>
