<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 300" width="100%" role="img" aria-labelledby="t"><title id="t">Mouad Hamdouchi, front-end. Station 4 of 6 on the path of a fire detection: Console.</title><style>:root{--ground:#FFFFFF;--ink:#0B0D12;--ink2:#394150;--muted:#5B6472;--blue:#0B3D91;--fire:#B8400E;--live:#9E0038;--line:#E3E6EB;--line2:#C9CED6}@media (prefers-color-scheme: dark){:root{--ground:#0B0D12;--ink:#F2F4F8;--ink2:#C3CAD6;--muted:#8E98AA;--blue:#7FB0FF;--fire:#F0803C;--live:#FF5C8A;--line:#232936;--line2:#586274}}.sans{font-family:ui-sans-serif, system-ui, "Segoe UI", sans-serif}.mono{font-family:ui-monospace, "SF Mono", Consolas, monospace}.ink{fill:var(--ink)}.mut{fill:var(--muted)}.blf{fill:var(--blue)}.bls{stroke:var(--blue)}.gnd{fill:var(--ground)}.box{fill:var(--ground);stroke:var(--line);stroke-width:1}.chain{fill:none;stroke:var(--line2);stroke-width:1.5;stroke-dasharray:1 5;stroke-linecap:round}.stn{font-size:11px;letter-spacing:2px;fill:var(--muted)}.stnl{fill:var(--fire)}.node{fill:var(--ground);stroke:var(--blue);stroke-opacity:.42;stroke-width:1.5}.ico{fill:none;stroke:var(--blue);stroke-opacity:.62;stroke-linecap:round;stroke-linejoin:round}.nodel{fill:var(--ground);stroke:var(--fire);stroke-width:1.5}.halo{fill:var(--fire);fill-opacity:.06;stroke:var(--fire);stroke-opacity:.45;stroke-width:1}.icol{fill:none;stroke:var(--fire);stroke-linecap:round;stroke-linejoin:round}.led{fill:currentColor}.ico .led{fill:var(--blue)}.icol .led{fill:var(--fire)}.first{font-size:22px;font-weight:700;fill:var(--ink)}.fam{font-size:16px;font-weight:400;fill:var(--muted)}.tick{stroke:var(--line2);stroke-width:1}.role{font-size:12px;letter-spacing:1.6px;fill:var(--ink2)}.ember{fill:var(--fire);opacity:0}.lit{opacity:0}.lit,.ein,.eout{animation-duration:9s;animation-iteration-count:infinite;animation-timing-function:linear;animation-delay:-4.5s}.lit{animation-name:lit}@keyframes lit{0%{opacity:0}3.33%{opacity:1}11.11%{opacity:1}17.78%{opacity:0}100%