<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 24" width="100%" role="img" aria-labelledby="t"><title id="t">Section divider</title><style>:root{--ground:#FFFFFF;--ink:#0B0D12;--ink2:#394150;--muted:#5B6472;--blue:#0B3D91;--fire:#B8400E;--live:#9E0038;--line:#E3E6EB;--line2:#C9CED6}@media (prefers-color-scheme: dark){:root{--ground:#0B0D12;--ink:#F2F4F8;--ink2:#C3CAD6;--muted:#8E98AA;--blue:#7FB0FF;--fire:#F0803C;--live:#FF5C8A;--line:#232936;--line2:#586274}}.sans{font-family:ui-sans-serif, system-ui, "Segoe UI", sans-serif}.mono{font-family:ui-monospace, "SF Mono", Consolas, monospace}.ink{fill:var(--ink)}.mut{fill:var(--muted)}.blf{fill:var(--blue)}.bls{stroke:var(--blue)}.gnd{fill:var(--ground)}.hair{fill:none;stroke:var(--line2);stroke-width:1}.edot{fill:var(--fire)}.eglow{fill:var(--fire);fill-opacity:.16}@media (prefers-color-scheme: dark){.trail{opacity:.9}}.em{transform:translateX(600px)}.em{animation:em 10s linear infinite}@keyframes em{0%{transform:translateX(-20px)}100%{transform:translateX(1292px)}}@media (prefers-reduced-motion: reduce){.em{animation:none;transform:translateX(600px)}}</style><defs><linearGradient id="tr" x1="0" x2="1"><stop offset="0" stop-color="#B8400E" stop-opacity="0"/><stop offset="1" stop-color="#B8400E" stop-opacity=".7"/></linearGradient></defs><path d="M0 12H1200" class="hair"/><g class="em"><rect x="-72" y="11.25" width="68" height="1.5" fill="url(#tr)" class="trail"/><circle cx="0" cy="12" r="7" class="eglow"/><circle cx="0" cy="12" r="2.6" class="edot"/></g></svg>
