<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" role="img" aria-labelledby="t"><title id="t">The NIRAN agent in five steps: read NASA FIRMS, sense, watch, confirm, notify. A confirmed fire becomes a CAP-style alert for the fire service.</title><style>:root{--ground:#FFFFFF;--ink:#0B0D12;--ink2:#394150;--muted:#5B6472;--blue:#0B3D91;--fire:#B8400E;--live:#9E0038;--line:#E3E6EB;--line2:#C9CED6}@media (prefers-color-scheme: dark){:root{--ground:#0B0D12;--ink:#F2F4F8;--ink2:#C3CAD6;--muted:#8E98AA;--blue:#7FB0FF;--fire:#F0803C;--live:#FF5C8A;--line:#232936;--line2:#586274}}.sans{font-family:ui-sans-serif, system-ui, "Segoe UI", sans-serif}.mono{font-family:ui-monospace, "SF Mono", Consolas, monospace}.ink{fill:var(--ink)}.mut{fill:var(--muted)}.blf{fill:var(--blue)}.bls{stroke:var(--blue)}.gnd{fill:var(--ground)}.track{fill:none;stroke:var(--line2);stroke-width:1.5;stroke-linecap:round}.prog{fill:none;stroke:var(--fire);stroke-width:1.5;stroke-dasharray:840 840;stroke-dashoffset:0}.pdot{fill:var(--fire)}.pglow{fill:var(--fire);fill-opacity:.18}.node{fill:var(--ground);stroke:var(--blue);stroke-opacity:.45;stroke-width:1.5}.ico{fill:none;stroke:var(--blue);stroke-opacity:.6;stroke-linecap:round;stroke-linejoin:round}.nl{stroke-width:1.5}.nl.fire{fill:var(--ground);stroke:var(--fire)}.nl.live{fill:var(--ground);stroke:var(--live)}.icl{fill:none;stroke-linecap:round;stroke-linejoin:round}.icl.fire{stroke:var(--fire)}.icl.live{stroke:var(--live)}.burst{fill:none;stroke-width:1.2;opacity:0;transform-box:fill-box;transform-origin:center}.burst.fire{stroke:var(--fire)}.burst.live{stroke:var(--live)}.step{font-size:11px;letter-spacing:1.6px;fill:var(--muted)}.ttl{font-size:15px;font-weight:600}.rule{font-size:11px;fill:var(--ink2)}.clink{fill:none;stroke:var(--live);stroke-width:1.5;stroke-dasharray:2 3}.cbox{fill:var(--ground);stroke:var(--live);stroke-width:1.5}.clab{font-size:10.5px;letter-spacing:1.4px;fill:var(--live)}.cdot{fill:var(--live)}.ctl{font-size:15px;font-weight:600}.csub{font-size:10.5px}.pulse{opacity:0}.prog{animation:prog 10s linear infinite}@keyframes prog{0%,5%{stroke-dashoffset:840;opacity:1}65%,88%{stroke-dashoffset:0;opacity:1}94%{stroke-dashoffset:0;opacity:0}99%{stroke-dashoffset:840;opacity:0}100%{stroke-dashoffset:840;opacity:1}}.pulse{animation:pulse 10s linear infinite}@keyframes pulse{0%{transform:translateX(0);opacity:0}3%{opacity:0}5%{transform:translateX(0);opacity:1}64%{opacity:1}65%{transform:translateX(840px);opacity:0}100%{transform:translateX(840px);opacity:0}}.card{animation:card 10s cubic-bezier(.2,.7,.2,1) infinite}@keyframes card{0%,68%{opacity:0;transform:translateX(-26px)}74%,88%{opacity:1;transform:translateX(0)}94%,100%{opacity:0;transform:translateX(0)}}.cdot{animation:blink 1.25s ease-in-out infinite}@keyframes blink{50%{opacity:.25}}.n0{animation:n0 10s linear infinite}@keyframes n0{0%,5%{opacity:0}7%,88%{opacity:1}94%,100%{opacity:0}}.r0{animation:r0 10s linear infinite}@keyframes r0{0%,5%{opacity:.38}8%,88%{opacity:1}94%,100%{opacity:.38}}.b0{animation:b0 10s ease-out infinite}@keyframes b0{0%,5%{opacity:0;transform:scale(1)}5.5%{opacity:.7;transform:scale(1)}14%{opacity:0;transform:scale(1.8)}100%{opacity:0;transform:scale(1.8)}}.n1{animation:n1 10s linear infinite}@keyframes n1{0%,20%{opacity:0}22%,88%{opacity:1}94%,100%{opacity:0}}.r1{animation:r1 10s linear infinite}@keyframes r1{0%,20%{opacity:.38}23%,88%{opacity:1}94%,100%{opacity:.38}}.b1{animation:b1 10s ease-out infinite}@keyframes b1{0%,20%{opacity:0;transform:scale(1)}20.5%{opacity:.7;transform:scale(1)}29%{opacity:0;transform:scale(1.8)}100%{opacity:0;transform:scale(1.8)}}.n2{animation:n2 10s linear infinite}@keyframes n2{0%,35%{opacity:0}37%,88%{opacity:1}94%,100%{opacity:0}}.r2{animation:r2 10s linear infinite}@keyframes r2{0%,35%{opacity:.38}38%,88%{opacity:1}94%,100%{opacity:.38}}.b2{animation:b2 10s ease-out infinite}@keyframes b2{0%,35%{opacity:0;transform:scale(1)}35.5%{opacity:.7;transform:scale(1)}44%{opacity:0;transform:scale(1.8)}100%{opacity:0;transform:scale(1.8)}}.n3{animation:n3 10s linear infinite}@keyframes n3{0%,50%{opacity:0}52%,88%{opacity:1}94%,100%{opacity:0}}.r3{animation:r3 10s linear infinite}@keyframes r3{0%,50%{opacity:.38}53%,88%{opacity:1}94%,100%{opacity:.38}}.b3{animation:b3 10s ease-out infinite}@keyframes b3{0%,50%{opacity:0;transform:scale(1)}50.5%{opacity:.7;transform:scale(1)}59%{opacity:0;transform:scale(1.8)}100%{opacity:0;transform:scale(1.8)}}.n4{animation:n4 10s linear infinite}@keyframes n4{0%,65%{opacity:0}67%,88%{opacity:1}94%,100%{opacity:0}}.r4{animation:r4 10s linear infinite}@keyframes r4{0%,65%{opacity:.38}68%,88%{opacity:1}94%,100%{opacity:.38}}.b4{animation:b4 10s ease-out infinite}@keyframes b4{0%,65%{opacity:0;transform:scale(1)}65.5%{opacity:.7;transform:scale(1)}74%{opacity:0;transform:scale(1.8)}100%{opacity:0;transform:scale(1.8)}}@media (prefers-reduced-motion: reduce){.prog,.pulse,.card,.cdot,.lit,.rule,.burst{animation:none}.lit,.rule,.card{opacity:1}.prog{stroke-dashoffset:0}.pulse,.burst{opacity:0}}</style><rect width="1200" height="300" class="gnd"/><path d="M100 112H940" class="track"/><path d="M100 112H940" class="prog"/><g class="pulse"><circle cx="100" cy="112" r="10" class="pglow"/><circle cx="100" cy="112" r="4" class="pdot"/></g><text x="100" y="66" class="mono step" text-anchor="middle">01</text><circle cx="100" cy="112" r="26" class="node"/><g transform="translate(85 97) scale(1.25)" class="ico" style="stroke-width:1.2"><rect x="9" y="9" width="6" height="6" rx="1"/><path d="M3 9h4v6H3zM17 9h4v6h-4zM12 15v3M9.5 21h5"/></g><g class="lit n0"><circle cx="100" cy="112" r="26" class="nl fire"/><g transform="translate(85 97) scale(1.25)" class="icl fire" style="stroke-width:1.2"><rect x="9" y="9" width="6" height="6" rx="1"/><path d="M3 9h4v6H3zM17 9h4v6h-4zM12 15v3M9.5 21h5"/></g></g><circle cx="100" cy="112" r="26" class="burst fire b0"/><text x="100" y="170" class="sans ttl ink" text-anchor="middle">Read NASA FIRMS</text><text x="100" y="194" class="mono rule r0" text-anchor="middle">MODIS 7 days + VIIRS 24 h<tspan x="100" dy="16">every 10 min</tspan></text><text x="310" y="66" class="mono step" text-anchor="middle">02</text><circle cx="310" cy="112" r="26" class="node"/><g transform="translate(295 97) scale(1.25)" class="ico" style="stroke-width:1.2"><path d="M4 16a8 8 0 0 1 16 0"/><path d="m12 16 4-4.5"/></g><g class="lit n1"><circle cx="310" cy="112" r="26" class="nl fire"/><g transform="translate(295 97) scale(1.25)" class="icl fire" style="stroke-width:1.2"><path d="M4 16a8 8 0 0 1 16 0"/><path d="m12 16 4-4.5"/></g></g><circle cx="310" cy="112" r="26" class="burst fire b1"/><text x="310" y="170" class="sans ttl ink" text-anchor="middle">Sense</text><text x="310" y="194" class="mono rule r1" text-anchor="middle">Last 7 days vs<tspan x="310" dy="16">same days 2020–2025</tspan></text><text x="520" y="66" class="mono step" text-anchor="middle">03</text><circle cx="520" cy="112" r="26" class="node"/><g transform="translate(505 97) scale(1.25)" class="ico" style="stroke-width:1.2"><path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="2.6"/></g><g class="lit n2"><circle cx="520" cy="112" r="26" class="nl fire"/><g transform="translate(505 97) scale(1.25)" class="icl fire" style="stroke-width:1.2"><path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="2.6"/></g></g><circle cx="520" cy="112" r="26" class="burst fire b2"/><text x="520" y="170" class="sans ttl ink" text-anchor="middle">Watch</text><text x="520" y="194" class="mono rule r2" text-anchor="middle">Country above usual<tspan x="520" dy="16">goes on watch</tspan></text><text x="730" y="66" class="mono step" text-anchor="middle">04</text><circle cx="730" cy="112" r="26" class="node"/><g transform="translate(715 97) scale(1.25)" class="ico" style="stroke-width:1.2"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></g><g class="lit n3"><circle cx="730" cy="112" r="26" class="nl fire"/><g transform="translate(715 97) scale(1.25)" class="icl fire" style="stroke-width:1.2"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></g></g><circle cx="730" cy="112" r="26" class="burst fire b3"/><text x="730" y="170" class="sans ttl ink" text-anchor="middle">Confirm</text><text x="730" y="194" class="mono rule r3" text-anchor="middle">2+ detections, or one ≥ 20 MW,<tspan x="730" dy="16">in a ~10 km cell</tspan></text><text x="940" y="66" class="mono step" text-anchor="middle">05</text><circle cx="940" cy="112" r="26" class="node"/><g transform="translate(925 97) scale(1.25)" class="ico" style="stroke-width:1.2"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></g><g class="lit n4"><circle cx="940" cy="112" r="26" class="nl live"/><g transform="translate(925 97) scale(1.25)" class="icl live" style="stroke-width:1.2"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></g></g><circle cx="940" cy="112" r="26" class="burst live b4"/><text x="940" y="170" class="sans ttl ink" text-anchor="middle">Notify</text><text x="940" y="194" class="mono rule r4" text-anchor="middle">CAP-style alert to<tspan x="940" dy="16">console + webhook</tspan></text><g class="card"><path d="M970 112H994" class="clink"/><rect x="994" y="72" width="186" height="80" rx="6" class="cbox"/><text x="1010" y="96" class="mono clab">ALERT · CAP 1.2</text><circle cx="1162" cy="92" r="3.5" class="cdot"/><text x="1010" y="119" class="sans ctl ink">Confirmed fire</text><text x="1010" y="138" class="mono csub mut">where · when · evidence</text></g></svg>
