ity:0}100%{opacity:0}}.ein{animation-name:ein}.eout{animation-name:eout}@keyframes eout{0%,11.1%{opacity:0;transform:translateX(0)}11.2%{opacity:1;transform:translateX(0)}13.8%{opacity:1;transform:translateX(88px)}13.9%,100%{opacity:0;transform:translateX(88px)}}@keyframes ein{0%,97.1%{opacity:0;transform:translateX(0)}97.2%{opacity:1;transform:translateX(0)}99.8%{opacity:1;transform:translateX(88px)}100%{opacity:0;transform:translateX(88px)}}.ring{transform-box:fill-box;transform-origin:center;animation:ring 3s ease-out infinite}@keyframes ring{0%{transform:scale(.75);opacity:0}12%{transform:scale(.8);opacity:.8}100%{transform:scale(1.3);opacity:0}}.swing{transform-box:fill-box;transform-origin:50% 0;animation:swing 3s ease-in-out infinite}@keyframes swing{0%,40%,100%{transform:rotate(0)}10%{transform:rotate(7deg)}20%{transform:rotate(-5deg)}30%{transform:rotate(2deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}.lit{opacity:0}.ember{opacity:0}}</style><rect x="1" y="1" width="278" height="298" rx="12" class="box"/><path d="M0 118H94M186 118H280" class="chain"/><text x="140" y="52" class="mono stn" text-anchor="middle">05 · AGENT</text><circle cx="140" cy="118" r="40" class="node"/><g transform="translate(119 97) scale(1.75)" class="ico" style="stroke-width:0.86"><circle cx="12" cy="12" r="9.5" class="ring"/><g class="swing"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></g></g><g class="lit"><circle cx="140" cy="118" r="50" class="halo"/><circle cx="140" cy="118" r="40" class="nodel"/><g transform="translate(119 97) scale(1.75)" class="icol" style="stroke-width:0.86"><circle cx="12" cy="12" r="9.5" class="ring"/><g class="swing"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></g></g><text x="140" y="52" class="mono stn stnl" text-anchor="middle">05 · AGENT</text></g><circle cx="0" cy="118" r="3" class="ember ein"/><circle cx="186" cy="118" r="3" class="ember eout"/><text 