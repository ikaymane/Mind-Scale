<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="100%" role="img" aria-labelledby="title desc">
<title id="title">NIRAN levels: low, normal, high, unusual, extreme</title>
<desc id="desc">A marker moves slowly from low to extreme and back. Names and colours come directly from web/src/levels.ts. The scale compares observed detections with the country&#x27;s usual activity; it is not a forecast.</desc>
<style>:root{--ground:#FFFFFF;--ink:#0B0D12;--ink2:#394150;--muted:#5B6472;--blue:#0B3D91;--fire:#B8400E;--live:#9E0038;--line:#E3E6EB;--line2:#C9CED6}@media (prefers-color-scheme: dark){:root{--ground:#0B0D12;--ink:#F2F4F8;--ink2:#C3CAD6;--muted:#8E98AA;--blue:#7FB0FF;--fire:#F0803C;--live:#FF5C8A;--line:#232936;--line2:#586274}}.sans{font-family:ui-sans-serif, system-ui, "Segoe UI", sans-serif}.mono{font-family:ui-monospace, "SF Mono", Consolas, monospace}.ink{fill:var(--ink)}.mut{fill:var(--muted)}.blf{fill:var(--blue)}.bls{stroke:var(--blue)}.gnd{fill:var(--ground)}.hair{fill:none;stroke:var(--line);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.node{fill:var(--ground);stroke:var(--blue);stroke-opacity:.45;stroke-width:1.5}.eyebrow{font-size:12px;letter-spacing:1.6px;fill:var(--muted)}.detail{font-size:14px;letter-spacing:.5px;fill:var(--muted)}.still{display:none}.level-dot{stroke:var(--ground);stroke-width:1.5}.marker{fill:none;stroke-width:1.5;animation:walk 10s ease-in-out infinite}.level-name{font-size:20px;letter-spacing:.5px}.stop{fill:none;stroke-width:1.5;opacity:.2}@keyframes walk{0%,4%{transform:translateX(0px);stroke:#3A6EA5}10%,16%{transform:translateX(240px);stroke:#C8CCD1}22%,28%{transform:translateX(480px);stroke:#F0A33A}34%,40%{transform:translateX(720px);stroke:#DD5A2B}46%,54%{transform:translateX(960px);stroke:#8C1C2F}60%,66%{transform:translateX(720px);stroke:#DD5A2B}72%,78%{transform:translateX(480px);stroke:#F0A33A}84%,90%{transform:translateX(240px);stroke:#C8CCD1}96%,100%{transform:translateX(0px);stroke:#3A6EA5}}@media(prefers-reduced-motion:reduce){.marker{animation:none;display:none}.stop{opacity:.7}}</style>
<rect width="1200" height="200" class="gnd"/>
<text x="60" y="28" class="mono eyebrow" >FIRE ACTIVITY · AGAINST USUAL</text><path d="M120 91H1080" class="hair"/><circle cx="120" cy="91" r="18" class="stop" stroke="#3A6EA5"/><circle cx="120" cy="91" r="6" class="level-dot" fill="#3A6EA5"/><text x="120" y="148" class="mono ink level-name" text-anchor="middle">low</text><circle cx="360" cy="91" r="18" class="stop" stroke="#C8CCD1"/><circle cx="360" cy="91" r="6" class="level-dot" fill="#C8CCD1"/><text x="360" y="148" class="mono ink level-name" text-anchor="middle">normal</text><circle cx="600" cy="91" r="18" class="stop" stroke="#F0A33A"/><circle cx="600" cy="91" r="6" class="level-dot" fill="#F0A33A"/><text x="600" y="148" class="mono ink level-name" text-anchor="middle">high</text><circle cx="840" cy="91" r="18" class="stop" stroke="#DD5A2B"/><circle cx="840" cy="91" r="6" class="level-dot" fill="#DD5A2B"/><text x="840" y="148" class="mono ink level-name" text-anchor="middle">unusual</text><circle cx="1080" cy="91" r="18" class="stop" stroke="#8C1C2F"/><circle cx="1080" cy="91" r="6" class="level-dot" fill="#8C1C2F"/><text x="1080" y="148" class="mono ink level-name" text-anchor="middle">extreme</text><circle cx="120" cy="91" r="19" class="marker"/>
</svg>
